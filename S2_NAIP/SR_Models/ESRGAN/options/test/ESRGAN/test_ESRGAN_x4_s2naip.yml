name: ESRGAN_x4_f64b23_naips2_B16G1_v1
model_type: ESRGANModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test_1:  # the 1st test dataset
    name: NAIPS2
    type: PairedImageDataset
    dataroot_gt: ../../../NAIPS2_dataset/naips2_CONUS3/test/naip
    dataroot_lq: ../../../NAIPS2_dataset/naips2_CONUS3/test/s2

    filename_tmpl: '{}'
    io_backend:
      type: disk

# network structures
network_g:
  type: RRDBNet
  num_in_ch: 12
  num_out_ch: 4
  num_feat: 64
  num_block: 23
  num_grow_ch: 32

# path
path:
  pretrain_network_g: experiments/pretrained_models/ESRGAN/net_g_latest.pth
  strict_load_g: true

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false
